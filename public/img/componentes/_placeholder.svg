<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Imagem do componente em breve">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="120" y="120" width="160" height="160" rx="20" fill="url(#chip)" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4"/>
  <!-- pinagem -->
  <g fill="#06b6d4" opacity="0.6">
    <rect x="100" y="150" width="20" height="6"/>
    <rect x="100" y="170" width="20" height="6"/>
    <rect x="100" y="190" width="20" height="6"/>
    <rect x="100" y="210" width="20" height="6"/>
    <rect x="100" y="230" width="20" height="6"/>
    <rect x="100" y="250" width="20" height="6"/>
    <rect x="280" y="150" width="20" height="6"/>
    <rect x="280" y="170" width="20" height="6"/>
    <rect x="280" y="190" width="20" height="6"/>
    <rect x="280" y="210" width="20" height="6"/>
    <rect x="280" y="230" width="20" height="6"/>
    <rect x="280" y="250" width="20" height="6"/>
  </g>
  <!-- chip central com IC -->
  <rect x="170" y="170" width="60" height="60" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="180" cy="180" r="2" fill="#06b6d4"/>
  <text x="200" y="206" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#06b6d4" text-anchor="middle" opacity="0.9">IC</text>
  <text x="200" y="330" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="800" fill="#06b6d4" text-anchor="middle" letter-spacing="3" opacity="0.7">DEVGENIUS V12</text>
  <text x="200" y="355" font-family="ui-sans-serif,sans-serif" font-size="10" font-weight="600" fill="#737373" text-anchor="middle" letter-spacing="2">FOTO EM BREVE</text>
</svg>
